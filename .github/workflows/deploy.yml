name: Deploy to GitHub Pages

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Build and verify
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Stamps the release datetime into the source HTML before the build, so Workbox hashes the final bytes.
      - name: Stamp version
        run: sed -i 's|<span id="version">v. dev</span>|<span id="version">v. '"$(date -u '+%Y-%m-%d %H:%M:%S UTC')"'</span>|' src/index.html

      # No native Node setup: verify runs inside the same pinned container compose.yaml and agents use, and GitHub-hosted runners already have Docker Compose.
      - name: Verify
        run: docker compose run --rm verify

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    name: Deploy
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
