x-common: &common
  working_dir: /app
  volumes:
    - .:/app
    - node_modules:/app/node_modules

services:
  build:
    <<: *common
    # Pinned by digest, never by tag: a tag is a name its owner can move.
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    command: sh -c "npm ci && npm run build"

  preview:
    <<: *common
    image: node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6
    ports:
      # Loopback only. A bare "4173:4173" would put the server on the local network.
      - "127.0.0.1:4173:4173"
    command: sh -c "npm ci && npm run serve:docker"

  # deploy.yml runs this same service and publishes the dist/ it leaves behind.
  # Plain verify skips deploy.yml's version stamp, so before calling a change ready also run verify on a copy of the tree after its Stamp version sed.
  verify:
    <<: *common
    # Microsoft's official Playwright image, used as published. Tag's version segment must match package.json's pinned playwright version.
    image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    command: sh -c "npm ci && npm run verify:run"

volumes:
  node_modules:
